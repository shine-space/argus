<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子动效 - 朝夕智能</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.fch{--fc-brass:#F36A4B;position:relative;width:100vw;height:100vh;background:transparent}.fch-orb{position:absolute;z-index:3;left:50%;top:50%;width:min(100vw,100vh);aspect-ratio:1;translate:-50% -50%;border-radius:50%;outline:none}.fch-orb[role=button]{cursor:pointer}.fch-orb:focus-visible{outline:1px solid #f36a4b;outline-offset:4px}.fch-orb>canvas{position:absolute;left:-15%;top:-15%;width:130%;height:130%;display:block}.fch-halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--fc-brass) 22%,transparent) 0%,color-mix(in srgb,var(--fc-brass) 7%,transparent) 30%,color-mix(in srgb,var(--fc-brass) .4%,transparent) 58%);pointer-events:none;z-index:-1}</style></head><body><section class="fch"><div class="fch-orb"><canvas aria-hidden="true"></canvas><span class="fch-halo" aria-hidden="true"></span></div></section><script type="module" src="/particle-shapes/core-renderer.mjs?v=1"></script></body></html>
